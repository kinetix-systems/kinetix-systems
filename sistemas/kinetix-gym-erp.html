<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#080c15">
  <title>Kinetix Gym ERP Pro | Demo en Vivo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #070b13; color: #f1f5f9; margin: 0; padding: 0; overflow: hidden; height: 100vh; }
  </style>
</head>
<body class="flex flex-col h-screen">
  <!-- Top Demo Bar -->
  <header class="h-12 bg-slate-950/95 border-b border-amber-500/30 px-4 flex items-center justify-between shrink-0 z-20">
    <div class="flex items-center gap-3">
      <span class="px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-300 font-mono font-bold text-[11px] border border-amber-500/40 flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
        DEMO EN VIVO FUNCIONAL
      </span>
      <h1 class="text-xs sm:text-sm font-black text-white truncate">
        Kinetix Gym ERP Pro <span class="hidden md:inline font-mono text-slate-400 font-normal">· Acceso con Semáforo, POS Mostrador & Arqueo</span>
      </h1>
    </div>

    <div class="flex items-center gap-2">
      <a href="../index.html" class="px-3 py-1.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-800 text-xs font-bold transition">
        &larr; Volver a Kinetix
      </a>
      <a href="../index.html#catalogo-sistemas" class="px-4 py-1.5 rounded-xl bg-gradient-to-r from-amber-400 to-yellow-400 hover:opacity-95 text-slate-950 font-black text-xs shadow-md transition">
        Comprar Este Sistema ($89 USD)
      </a>
    </div>
  </header>

  <!-- Live App Iframe -->
  <main class="flex-1 w-full relative">
    <iframe src="https://kinetix-gym-erp.vercel.app" class="w-full h-full border-0" allow="camera; microphone; clipboard-write;" title="Kinetix Gym ERP Pro"></iframe>
  </main>
  <script src="kinetix-cloud-guard.js"></script>
</body>
</html>
